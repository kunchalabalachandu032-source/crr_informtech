<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- FORCED 1200px DESKTOP RESOLUTION FOR MOBILE AND TABLET -->
<meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=3.0">
<title>Manage Subject Resources | CR Portal</title>
<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

/* FORCE 1200px DESKTOP RESOLUTION */
html, body {
    min-width: 1200px !important; width: 1200px !important;
    margin: 0 auto !important; overflow-x: auto !important;
    background: url('/admin/college_bg.jpg') no-repeat center center fixed;
    background-size: cover; min-height: 100vh; position: relative;
}
body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 25, 47, 0.55); backdrop-filter: blur(2px); z-index: 0;
}

.sidebar, .main-content { position: relative; z-index: 1; }

/* Left Blue Sidebar */
.sidebar {
    position: fixed; left: 0; top: 0; width: 270px !important; height: 100vh;
    background: linear-gradient(180deg, rgba(15, 43, 70, 0.95) 0%, rgba(13, 110, 253, 0.95) 100%);
    backdrop-filter: blur(12px); color: white; padding-top: 25px;
    box-shadow: 4px 0 20px rgba(0,0,0,0.3); z-index: 100; overflow-y: auto;
    transform: none !important;
}

.sidebar-header {
    text-align: center; padding: 0 15px 22px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 20px;
}
.sidebar-logo { width: 55px; height: 55px; border-radius: 50%; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
.sidebar-header h4 { font-weight: 800; font-size: 18px; margin: 0; letter-spacing: 0.5px; color: #ffffff; }
.sidebar-header small { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }

.sidebar a {
    display: flex; align-items: center; gap: 14px; padding: 14px 25px;
    color: rgba(255, 255, 255, 0.9); text-decoration: none; font-size: 14px;
    font-weight: 500; transition: all 0.25s ease; border-left: 4px solid transparent; cursor: pointer;
}
.sidebar a:hover, .sidebar a.active {
    background: rgba(255, 255, 255, 0.18); color: #ffffff;
    border-left-color: #38bdf8; padding-left: 28px;
}

.main-content { margin-left: 270px !important; width: 930px !important; padding: 40px; }

.header-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3); padding: 28px 32px; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); margin-bottom: 30px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
}
.header-card h2 { color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

.resource-section-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border-radius: 20px; padding: 32px; box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    border: 1px solid rgba(255, 255, 255, 0.3); margin-bottom: 25px; color: white;
}

.resource-item-row {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px;
    padding: 18px 24px; margin-top: 14px; transition: transform 0.2s ease;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; color: #ffffff;
}

.btn-glass-white {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
    color: #ffffff !important; border: 1.5px solid rgba(255, 255, 255, 0.45);
    border-radius: 12px; font-weight: 700; font-size: 14px;
    padding: 9px 18px; transition: all 0.25s ease; text-decoration: none; display: inline-block;
}
.btn-glass-white:hover { background: rgba(255, 255, 255, 0.45); transform: translateY(-2px); }

.btn-delete-item {
    background: #dc2626; color: #ffffff !important; border: none;
    border-radius: 10px; font-weight: 700; font-size: 13px;
    padding: 8px 16px; transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); cursor: pointer;
}
.btn-delete-item:hover { background: #b91c1c; transform: translateY(-1px); }
</style>
</head>

<body>

<!-- Left Sidebar Navigation -->
<div class="sidebar" id="sidebar-menu">
    <div class="sidebar-header">
        <img src="/admin/logo.png" class="sidebar-logo" alt="CRR Logo">
        <h4>CRR INFORMTECH</h4>
        <small id="sidebar-sec-badge">CR PORTAL</small>
    </div>

    <a href="/cr/subjects.html" id="back-subjects-link"><i class="fa-solid fa-arrow-left"></i> Back to Subjects</a>
    <div id="sidebar-menu-links"></div>
</div>

<!-- Main Content Area -->
<div class="main-content" id="main-container">
    <div class="header-card">
        <div>
            <span class="badge bg-primary px-3 py-1 text-white fw-bold mb-2 d-inline-block" style="border-radius:20px; font-size:11px;" id="sub-type-badge">THEORY</span>
            <h2 class="fw-bold mb-1" id="subject-title-header">Subject Management</h2>
            <p class="mb-0 text-white-50" id="section-meta-text">Upload lecture notes, assignments, mid marks for your class</p>
        </div>
        <a href="/cr/subjects.html" class="btn-glass-white">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Subjects
        </a>
    </div>

    <div id="main-resource-cards"></div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal fade" id="uploadResourceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 18px;">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="uploadModalTitle"><i class="fa-solid fa-cloud-arrow-up me-2"></i> Upload Resource</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="uploadResourceForm" enctype="multipart/form-data">
                <div class="modal-body p-4" id="uploadModalBody">
                    <!-- Injected dynamically -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-resource-btn"><i class="fa-solid fa-upload me-1"></i> Upload</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const year = urlParams.get('year') || '2';
const section = urlParams.get('section') || 'IT2A';
const subject = urlParams.get('subject') || '';
const type = (urlParams.get('type') || 'Theory').toLowerCase();
const isLab = type === 'lab';

let currentActiveTab = isLab ? 'lab-observations' : 'class-works';

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('sidebar-sec-badge').textContent = `Year ${year} - Section ${section}`;
    document.getElementById('subject-title-header').textContent = `${subject} (${isLab ? 'Lab' : 'Theory'})`;
    
    if (isLab) {
        setupLabTabContainer();
        loadObservations();
        loadRecords();
    } else {
        setupTheoryTabContainer();
        loadClassWorks();
        loadAssignments();
        loadMidMarks();
        loadImpQuestions();
    }
});

function setupTheoryTabContainer() {
    document.getElementById('sidebar-menu-links').innerHTML = `
        <a class="active" onclick="switchTab('class-works', this)"><i class="fa-solid fa-file-lines"></i> Class Works & Notes</a>
        <a onclick="switchTab('assignments', this)"><i class="fa-solid fa-pen-to-square"></i> Student Assignments</a>
        <a onclick="switchTab('mid-marks', this)"><i class="fa-solid fa-chart-column"></i> Mid Marks Sheets</a>
        <a onclick="switchTab('important-questions', this)"><i class="fa-solid fa-question-circle"></i> Important Questions</a>
    `;

    document.getElementById('main-resource-cards').innerHTML = `
        <div class="resource-section-card" id="card-class-works">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-white mb-0"><i class="fa-solid fa-file-lines text-primary me-2"></i> Class Works & Notes</h4>
                <button class="btn-glass-white btn-sm" onclick="openUploadModal('class-works')"><i class="fa-solid fa-plus-circle me-1"></i> Add Work/Notes</button>
            </div>
            <div id="works-container"><div class="text-center py-3 text-white-50">Loading...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-assignments">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-white mb-0"><i class="fa-solid fa-pen-to-square text-success me-2"></i> Student Assignments</h4>
                <button class="btn-glass-white btn-sm" onclick="openUploadModal('assignments')"><i class="fa-solid fa-plus-circle me-1"></i> Add Assignment</button>
            </div>
            <div id="assignments-container"><div class="text-center py-3 text-white-50">Loading...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-mid-marks">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-white mb-0"><i class="fa-solid fa-chart-column text-info me-2"></i> Mid Marks Sheets</h4>
                <button class="btn-glass-white btn-sm" onclick="openUploadModal('mid-marks')"><i class="fa-solid fa-plus-circle me-1"></i> Upload Marks Sheet</button>
            </div>
            <div id="midmarks-container"><div class="text-center py-3 text-white-50">Loading...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-important-questions">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-white mb-0"><i class="fa-solid fa-question-circle text-danger me-2"></i> Important Questions</h4>
                <button class="btn-glass-white btn-sm" onclick="openUploadModal('important-questions')"><i class="fa-solid fa-plus-circle me-1"></i> Add Question Bank</button>
            </div>
            <div id="impquestions-container"><div class="text-center py-3 text-white-50">Loading...</div></div>
        </div>
    `;
}

function setupLabTabContainer() {
    document.getElementById('sidebar-menu-links').innerHTML = `
        <a class="active" onclick="switchTab('lab-observations', this)"><i class="fa-solid fa-flask"></i> Lab Observations</a>
        <a onclick="switchTab('lab-records', this)"><i class="fa-solid fa-file-pdf"></i> Lab Record PDFs</a>
    `;

    document.getElementById('main-resource-cards').innerHTML = `
        <div class="resource-section-card" id="card-lab-observations">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-white mb-0"><i class="fa-solid fa-flask text-warning me-2"></i> Lab Observations</h4>
                <button class="btn-glass-white btn-sm" onclick="openUploadModal('lab-observations')"><i class="fa-solid fa-plus-circle me-1"></i> Add Observation</button>
            </div>
            <div id="obs-container"><div class="text-center py-3 text-white-50">Loading...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-lab-records">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold text-white mb-0"><i class="fa-solid fa-file-pdf text-danger me-2"></i> Lab Record PDFs</h4>
                <button class="btn-glass-white btn-sm" onclick="openUploadModal('lab-records')"><i class="fa-solid fa-plus-circle me-1"></i> Upload Record PDF</button>
            </div>
            <div id="records-container"><div class="text-center py-3 text-white-50">Loading...</div></div>
        </div>
    `;
}

function switchTab(tabId, el) {
    currentActiveTab = tabId;
    document.querySelectorAll('.resource-section-card').forEach(c => c.classList.add('d-none'));
    document.getElementById(`card-${tabId}`).classList.remove('d-none');
    document.querySelectorAll('#sidebar-menu-links a').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
}

// Data Fetchers with PROMINENT RED DELETE BUTTON FOR EACH ITEM
async function loadClassWorks() {
    const res = await fetch(`/api/class-works?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('works-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(w => `
            <div class="resource-item-row">
                <div><h6 class="fw-bold mb-1">${w.title}</h6><p class="small mb-0 text-white-50">${w.description || 'Lecture notes material'}</p></div>
                <div class="d-flex gap-2 align-items-center">
                    ${w.work_file ? `<a href="/${w.work_file}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
                    <button class="btn-delete-item" onclick="deleteResource('class-works', ${w.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } else container.innerHTML = `<div class="text-white-50 p-2">No class works uploaded yet.</div>`;
}

async function loadAssignments() {
    const res = await fetch(`/api/assignments?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('assignments-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(a => `
            <div class="resource-item-row">
                <div><h6 class="fw-bold mb-1">${a.title}</h6><small class="text-warning d-block">Due: ${a.due_date ? new Date(a.due_date).toLocaleDateString() : 'N/A'}</small></div>
                <div class="d-flex gap-2 align-items-center">
                    ${a.assignment_file ? `<a href="/${a.assignment_file}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
                    <button class="btn-delete-item" onclick="deleteResource('assignments', ${a.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } else container.innerHTML = `<div class="text-white-50 p-2">No assignments uploaded yet.</div>`;
}

async function loadMidMarks() {
    const res = await fetch(`/api/mid-marks?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('midmarks-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(m => `
            <div class="resource-item-row">
                <div><h6 class="fw-bold mb-0">${m.title}</h6></div>
                <div class="d-flex gap-2 align-items-center">
                    ${m.sheet_file ? `<a href="/${m.sheet_file}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-file-pdf me-1"></i> View Sheet</a>` : ''}
                    <button class="btn-delete-item" onclick="deleteResource('mid-marks', ${m.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } else container.innerHTML = `<div class="text-white-50 p-2">No mid marks sheets uploaded yet.</div>`;
}

async function loadImpQuestions() {
    const res = await fetch(`/api/important-questions?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('impquestions-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(q => `
            <div class="resource-item-row">
                <div><span class="badge bg-danger text-white mb-1">Unit ${q.unit_number || 'General'}</span><h6 class="fw-bold mb-0">${q.title}</h6></div>
                <div class="d-flex gap-2 align-items-center">
                    ${q.question_file ? `<a href="/${q.question_file}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
                    <button class="btn-delete-item" onclick="deleteResource('important-questions', ${q.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } else container.innerHTML = `<div class="text-white-50 p-2">No question banks uploaded yet.</div>`;
}

async function loadObservations() {
    const res = await fetch(`/api/lab-observations?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('obs-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(o => `
            <div class="resource-item-row">
                <div><span class="badge bg-warning text-dark mb-1">Exp #${o.experiment_no || '1'}</span><h6 class="fw-bold mb-0">${o.title}</h6></div>
                <div class="d-flex gap-2 align-items-center">
                    ${o.obs_file ? `<a href="/${o.obs_file}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
                    <button class="btn-delete-item" onclick="deleteResource('lab-observations', ${o.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } else container.innerHTML = `<div class="text-white-50 p-2">No observations uploaded yet.</div>`;
}

async function loadRecords() {
    const res = await fetch(`/api/lab-records?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('records-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(r => `
            <div class="resource-item-row">
                <div><span class="badge bg-danger text-white mb-1">Exp #${r.experiment_no || '1'}</span><h6 class="fw-bold mb-0">${r.title}</h6></div>
                <div class="d-flex gap-2 align-items-center">
                    ${r.record_file ? `<a href="/${r.record_file}" target="_blank" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-file-pdf me-1"></i> View Record PDF</a>` : ''}
                    <button class="btn-delete-item" onclick="deleteResource('lab-records', ${r.id})"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        `).join('');
    } else container.innerHTML = `<div class="text-white-50 p-2">No lab records uploaded yet.</div>`;
}

// Upload Modal Handler
function openUploadModal(tabType) {
    currentActiveTab = tabType;
    const body = document.getElementById('uploadModalBody');
    let fields = `<div class="mb-3"><label class="form-label fw-semibold text-dark">Title *</label><input type="text" id="r_title" class="form-control" placeholder="e.g. Unit 1 Notes" required></div>`;

    if (tabType === 'assignments') {
        fields += `<div class="mb-3"><label class="form-label fw-semibold text-dark">Due Date</label><input type="date" id="r_due_date" class="form-control"></div>`;
    } else if (tabType === 'important-questions') {
        fields += `<div class="mb-3"><label class="form-label fw-semibold text-dark">Unit Number</label><input type="number" id="r_unit" class="form-control" placeholder="1, 2, 3..."></div>`;
    } else if (tabType === 'lab-observations' || tabType === 'lab-records') {
        fields += `<div class="mb-3"><label class="form-label fw-semibold text-dark">Experiment Number</label><input type="number" id="r_exp_no" class="form-control" placeholder="1, 2, 3..."></div>`;
    }

    fields += `<div class="mb-3"><label class="form-label fw-semibold text-dark">Attach File *</label><input type="file" id="r_file" class="form-control" required></div>`;
    body.innerHTML = fields;

    const modal = new bootstrap.Modal(document.getElementById('uploadResourceModal'));
    modal.show();
}

document.getElementById('uploadResourceForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const saveBtn = document.getElementById('save-resource-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> Uploading...`;

    const formData = new FormData();
    formData.append('year', year);
    formData.append('section', section);
    formData.append('subject_name', subject);
    formData.append('title', document.getElementById('r_title').value);

    if (document.getElementById('r_due_date')) formData.append('due_date', document.getElementById('r_due_date').value);
    if (document.getElementById('r_unit')) formData.append('unit_number', document.getElementById('r_unit').value);
    if (document.getElementById('r_exp_no')) formData.append('experiment_no', document.getElementById('r_exp_no').value);

    const fileInput = document.getElementById('r_file');
    let fileFieldName = 'work_file';
    if (currentActiveTab === 'assignments') fileFieldName = 'assignment_file';
    else if (currentActiveTab === 'mid-marks') fileFieldName = 'sheet_file';
    else if (currentActiveTab === 'important-questions') fileFieldName = 'question_file';
    else if (currentActiveTab === 'lab-observations') fileFieldName = 'obs_file';
    else if (currentActiveTab === 'lab-records') fileFieldName = 'record_file';

    if (fileInput.files[0]) formData.append(fileFieldName, fileInput.files[0]);

    try {
        const res = await fetch(`/api/${currentActiveTab}`, { method: 'POST', body: formData });
        const result = await res.json();
        if (result.success) {
            bootstrap.Modal.getInstance(document.getElementById('uploadResourceModal')).hide();
            refreshCurrentTab();
        } else alert(result.message);
    } catch(err) { alert(err.message); }
    finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i class="fa-solid fa-upload me-1"></i> Upload`;
    }
});

function refreshCurrentTab() {
    if (currentActiveTab === 'class-works') loadClassWorks();
    else if (currentActiveTab === 'assignments') loadAssignments();
    else if (currentActiveTab === 'mid-marks') loadMidMarks();
    else if (currentActiveTab === 'important-questions') loadImpQuestions();
    else if (currentActiveTab === 'lab-observations') loadObservations();
    else if (currentActiveTab === 'lab-records') loadRecords();
}

async function deleteResource(endpoint, id) {
    if (confirm("Are you sure you want to delete this resource permanently?")) {
        try {
            const res = await fetch(`/api/${endpoint}/${id}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) refreshCurrentTab();
            else alert(result.message || 'Failed to delete resource');
        } catch(e) {
            alert('Server error while deleting resource');
        }
    }
}
</script>
</body>
</html>
