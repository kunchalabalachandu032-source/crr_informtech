<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=3.0">
    <title>CRR-INFORMTECH | Class Representative Login Portal</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        /* FORCE 1200px DESKTOP SCREEN RESOLUTION ON ALL DEVICES */
        html, body {
            min-width: 1200px !important;
            width: 1200px !important;
            margin: 0 auto !important;
            overflow-x: auto !important;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: url('/admin/college_bg.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 47, 0.65); backdrop-filter: blur(4px); z-index: 0;
        }

        .login-container { position: relative; z-index: 1; width: 1200px !important; height: 100%; display: flex; justify-content: center; align-items: center; }
        .login-card-wrapper {
            width: 100%; max-width: 480px; padding: 30px; text-align: center;
        }

        /* Letterhead Style */
        .logo-wrapper { margin-bottom: 12px; }
        .logo-img {
            width: 95px; height: 95px; object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.7));
            animation: logoGlow 3s infinite alternate;
        }
        @keyframes logoGlow {
            from { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
            to { filter: drop-shadow(0 0 25px rgba(255,255,255,0.9)); }
        }

        .college-title {
            color: #ffffff; font-size: 22px; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.7); margin-bottom: 2px;
        }
        .college-sub {
            color: #ff3333; font-weight: 700; font-size: 16px; margin-bottom: 4px;
        }
        .college-info {
            color: #e0e0e0; font-size: 12px; font-weight: 500; margin-bottom: 20px; line-height: 1.4;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px;
            padding: 30px 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: left;
        }
        .dept-title {
            color: #ffffff; font-weight: 800; font-size: 16px; letter-spacing: 1px; margin-bottom: 20px; text-align: center;
        }
        .form-label { font-size: 13.5px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .form-control {
            border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 500;
            background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255,255,255,0.5);
        }
        .form-control:focus { box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); border-color: #0284c7; }

        /* Password Box with Eye Icon Style */
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 45px; }
        .password-toggle-icon {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #64748b; font-size: 16px; z-index: 10; transition: color 0.2s ease;
        }
        .password-toggle-icon:hover { color: #0284c7; }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 15.5px; transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35); color: white; width: 100%;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #0369a1, #075985); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(2, 132, 199, 0.5); }
        .footer { margin-top: 25px; text-align: center; font-size: 13px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card-wrapper">

        <div class="logo-wrapper">
            <img src="/admin/logo.png" class="logo-img" alt="CRR Logo">
        </div>
        <h1 class="college-title">SIR C R REDDY COLLEGE OF ENGINEERING</h1>
        <div class="college-sub">(Autonomous)</div>
        <div class="college-info">
            ELURU, ANDHRA PRADESH 534007<br>
            (Approved by AICTE, New Delhi | Affiliated to JNTUK, Kakinada)
        </div>

        <div class="login-card">
            <div class="dept-title">
                CRR-INFORMTECH<br>
                <span style="font-size: 12px; font-weight: 600; color: #38bdf8;">CLASS REPRESENTATIVE LOGIN PORTAL</span>
            </div>

            <div id="error-alert" class="alert alert-danger py-2 text-center d-none" style="font-size: 13px;">
                <i class="fa-solid fa-circle-exclamation me-1"></i> <span id="error-msg"></span>
            </div>

            <form id="crLoginForm">
                <div class="mb-3">
                    <label class="form-label">Username / Email / Roll No</label>
                    <input type="text" id="usernameInput" name="login_identifier" class="form-control" placeholder="Enter Roll No, Email or Username" required autocomplete="off">
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="passwordInput" name="password" class="form-control" placeholder="Enter Password" required>
                        <i class="fa-solid fa-eye password-toggle-icon" id="togglePasswordIcon"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-lock me-2"></i> Login to CR Portal
                </button>
            </form>
        </div>

        <div class="footer">
            © 2026 CRR-INFORMTECH. All Rights Reserved.
        </div>

    </div>
</div>

<script>
    // Eye Icon Password Toggle
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');
    
    togglePasswordIcon.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.classList.remove('fa-eye');
            this.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            this.classList.remove('fa-eye-slash');
            this.classList.add('fa-eye');
        }
    });

    // Login Submission
    document.getElementById('crLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const loginIdentifier = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const errorAlert = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = this.querySelector('button[type="submit"]');

        errorAlert.classList.add('d-none');
        
        if (!loginIdentifier || !password) {
            errorMsg.textContent = "Username / Email / Roll number and Password are required!";
            errorAlert.classList.remove('d-none');
            return;
        }

        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...';
        loginBtn.disabled = true;

        try {
            const response = await fetch('/api/auth/cr/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: loginIdentifier,
                    roll_number: loginIdentifier,
                    password: password 
                })
            });

            const result = await response.json();

            if (result.success) {
                // Success -> Redirects to CR Dashboard!
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.textContent = result.message || "Invalid credentials! Check Username, Email, or Password.";
                errorAlert.classList.remove('d-none');
                loginBtn.innerHTML = '<i class="fa-solid fa-lock me-2"></i> Login to CR Portal';
                loginBtn.disabled = false;
            }
        } catch (error) {
            console.error("Login Error:", error);
            errorMsg.textContent = "Server connection error! Please make sure server is running.";
            errorAlert.classList.remove('d-none');
            loginBtn.innerHTML = '<i class="fa-solid fa-lock me-2"></i> Login to CR Portal';
            loginBtn.disabled = false;
        }
    });
</script>

</body>
</html>
