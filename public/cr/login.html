<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRR-INFORMTECH | Class Representative Login Portal</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html, body { width: 100%; height: 100%; }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-image: url('/admin/college_bg.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            overflow-x: hidden;
        }

        .login-container { width: 100%; height: 100%; max-width: 100%; }
        .login-card {
            background: transparent;
            border-radius: 0;
            width: 100%;
            height: 100%;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .login-card form { width: 100%; max-width: 420px; }

        .letterhead {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
            max-width: 720px;
            width: 100%;
        }
        .logo-wrapper {
            width: 180px; height: 180px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            animation: logoGlow 2s ease-in-out infinite;
        }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.85)) drop-shadow(0 0 6px rgba(2,132,199,0.7)); }
            50% { filter: drop-shadow(0 0 28px rgba(255,255,255,1)) drop-shadow(0 0 16px rgba(2,132,199,1)); }
        }

        .glow-text { animation: textGlow 2s ease-in-out infinite; }
        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 6px rgba(255,255,255,0.6), 0 0 3px rgba(2,132,199,0.6), 0 2px 6px rgba(0,0,0,0.7); }
            50% { text-shadow: 0 0 16px rgba(255,255,255,1), 0 0 10px rgba(2,132,199,1), 0 2px 6px rgba(0,0,0,0.7); }
        }

        .letterhead-text { text-align: left; }
        .letterhead-text h1 {
            font-size: 24px; font-weight: 800; color: #ffffff;
            margin-bottom: 4px; line-height: 1.2;
        }
        .letterhead-text h1 .autonomous { color: #ff2d2d; }
        .letterhead-text p {
            font-size: 14px; font-weight: 700; color: #ffffff;
            margin-bottom: 2px;
        }

        .logo-area h2 { font-size: 22px; font-weight: 800; color: #ffffff; margin-bottom: 2px; text-align: center; }
        .logo-area h5 { font-size: 14px; font-weight: 700; color: #ffffff; margin-bottom: 6px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }
        .logo-area p { font-size: 13px; font-weight: 700; color: #ffffff; margin-bottom: 25px; text-align: center; }

        .form-label { font-size: 14px; font-weight: 700; color: #ffffff; }
        .form-control { border-radius: 10px; padding: 12px; font-size: 14px; border: 1px solid #cbd5e1; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2); border-color: #0284c7; }

        /* Password Box with Eye Icon Style */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 45px;
        }
        .password-toggle-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            font-size: 16px;
            z-index: 10;
            transition: color 0.2s ease;
        }
        .password-toggle-icon:hover {
            color: #0284c7;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 15px; transition: all 0.3s ease;
        }
        .btn-primary:hover { background: linear-gradient(135deg, #0369a1, #075985); transform: translateY(-1px); }
        .footer { margin-top: 25px; text-align: center; font-size: 13px; font-weight: 700; color: #ffffff; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="letterhead">
            <div class="logo-wrapper">
                <img src="/admin/logo.png" class="logo-img" alt="College Logo">
            </div>
            <div class="letterhead-text">
                <h1 class="glow-text">SIR C R REDDY COLLEGE OF ENGINEERING <span class="autonomous">(Autonomous)</span></h1>
                <p class="glow-text">ELURU, ANDHRA PRADESH 534007</p>
                <p class="glow-text">(Approved by AICTE, New Delhi | Affiliated to JNTUK, Kakinada)</p>
            </div>
        </div>

        <div class="logo-area">
            <h2 class="glow-text">CRR-INFORMTECH</h2>
            <h5 class="glow-text">Department of Information Technology</h5>
            <p class="glow-text">Class Representative Login Portal</p>
        </div>

        <div id="error-alert" class="alert alert-danger py-2 text-center d-none" style="font-size: 13px; width: 100%; max-width: 420px;">
            <i class="fa-solid fa-circle-exclamation me-1"></i> <span id="error-msg"></span>
        </div>

        <form id="crLoginForm">
            <div class="mb-3">
                <label class="form-label glow-text">Username / Email / Roll No</label>
                <input type="text" id="usernameInput" name="login_identifier" class="form-control" placeholder="Enter Roll No, Email or Username" required autocomplete="off">
            </div>

            <div class="mb-4">
                <label class="form-label glow-text">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" name="password" class="form-control" placeholder="Enter Password" required>
                    <i class="fa-solid fa-eye password-toggle-icon" id="togglePasswordIcon"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login
            </button>
        </form>

        <div class="footer glow-text">
            © 2026 CRR-INFORMTECH. All Rights Reserved.
        </div>

    </div>
</div>

<script>
    // Eye Icon Password Toggle
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordIcon = document.getElementById('togglePasswordIcon');
    
    togglePasswordIcon.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.classList.remove('fa-eye');
            this.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            this.classList.remove('fa-eye-slash');
            this.classList.add('fa-eye');
        }
    });

    // Login Submission
    document.getElementById('crLoginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const loginIdentifier = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const errorAlert = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-msg');
        const loginBtn = this.querySelector('button[type="submit"]');

        errorAlert.classList.add('d-none');
        
        if (!loginIdentifier || !password) {
            errorMsg.textContent = "Username / Email / Roll number and Password are required!";
            errorAlert.classList.remove('d-none');
            return;
        }

        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Logging in...';
        loginBtn.disabled = true;

        try {
            const response = await fetch('/api/auth/cr/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: loginIdentifier,
                    roll_number: loginIdentifier,
                    password: password 
                })
            });

            const result = await response.json();

            if (result.success) {
                // Success -> Redirects to CR Dashboard!
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.textContent = result.message || "Invalid credentials! Check Username, Email, or Password.";
                errorAlert.classList.remove('d-none');
                loginBtn.innerHTML = 'Login';
                loginBtn.disabled = false;
            }
        } catch (error) {
            console.error("Login Error:", error);
            errorMsg.textContent = "Server connection error! Please make sure server is running.";
            errorAlert.classList.remove('d-none');
            loginBtn.innerHTML = 'Login';
            loginBtn.disabled = false;
        }
    });
</script>

</body>
</html>
