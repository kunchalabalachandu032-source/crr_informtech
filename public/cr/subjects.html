<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Subjects | CR Portal</title>
<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

/* College Background View with Light Blur & Dark Overlay */
body {
    background: url('/admin/college_bg.jpg') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    position: relative;
}
body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 25, 47, 0.55); backdrop-filter: blur(2px);
    z-index: 0;
}

.sidebar, .main-content, .sidebar-toggle-btn { position: relative; z-index: 1; }

/* 3-Lines Hamburger Menu Button */
.sidebar-toggle-btn {
    position: fixed; top: 22px; left: 245px; height: 40px; padding: 0 16px;
    border-radius: 12px; background: rgba(13, 110, 253, 0.9); backdrop-filter: blur(10px);
    color: #ffffff; border: 1.5px solid rgba(255,255,255,0.4); display: flex;
    align-items: center; gap: 8px; font-weight: 700; font-size: 13px;
    cursor: pointer; z-index: 1050; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.35s ease-in-out;
}
.sidebar-toggle-btn:hover { background: #0062cc; border-color: #ffffff; transform: translateY(-2px); }
.sidebar-toggle-btn.collapsed { left: 15px; }

/* Left Blue Sidebar */
.sidebar {
    position: fixed; left: 0; top: 0; width: 270px; height: 100vh;
    background: linear-gradient(180deg, rgba(15, 43, 70, 0.95) 0%, rgba(13, 110, 253, 0.95) 100%);
    backdrop-filter: blur(12px); color: white; padding-top: 25px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.3); z-index: 100; overflow-y: auto;
    transition: all 0.35s ease-in-out;
}
.sidebar.collapsed { transform: translateX(-270px); }

.sidebar-header {
    text-align: center; padding: 0 15px 22px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 20px;
}
.sidebar-logo { width: 55px; height: 55px; border-radius: 50%; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
.sidebar-header h4 { font-weight: 800; font-size: 18px; margin: 0; letter-spacing: 0.5px; color: #ffffff; }
.sidebar-header small { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }

.sidebar a {
    display: flex; align-items: center; gap: 14px; padding: 14px 25px;
    color: rgba(255, 255, 255, 0.9); text-decoration: none; font-size: 14px;
    font-weight: 500; transition: all 0.25s ease; border-left: 4px solid transparent;
}
.sidebar a:hover, .sidebar a.active {
    background: rgba(255, 255, 255, 0.18); color: #ffffff;
    border-left-color: #38bdf8; padding-left: 28px;
}

/* Main Content Area */
.main-content {
    margin-left: 270px; padding: 40px;
    transition: margin-left 0.35s ease-in-out;
}
.main-content.expanded { margin-left: 30px !important; }

.header-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3); padding: 28px 32px; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); margin-bottom: 30px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
}
.header-card h2 { color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.header-card p { color: rgba(255, 255, 255, 0.85); }

.subject-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 22px; padding: 26px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2); transition: transform 0.25s ease; height: 100%; color: white;
}
.subject-card:hover { transform: translateY(-4px); }

.badge-theory { background: #e0f2fe; color: #0284c7; font-weight: 700; font-size: 11px; padding: 5px 12px; border-radius: 12px; }
.badge-lab { background: #fef3c7; color: #d97706; font-weight: 700; font-size: 11px; padding: 5px 12px; border-radius: 12px; }

.btn-glass-white {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
    color: #ffffff !important; border: 1.5px solid rgba(255, 255, 255, 0.45);
    border-radius: 14px; font-weight: 700; font-size: 14.5px;
    padding: 10px 20px; transition: all 0.25s ease;
    text-decoration: none; display: inline-block;
}
.btn-glass-white:hover {
    background: rgba(255, 255, 255, 0.45); color: #ffffff !important;
    border-color: rgba(255, 255, 255, 0.7); transform: translateY(-2px);
}
</style>
</head>
<body>

<!-- 3-Lines Hamburger Menu Button -->
<button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
    <i class="fa-solid fa-bars"></i>
    <span>Menu</span>
</button>

<!-- Left Sidebar Navigation -->
<div class="sidebar" id="sidebar-menu">
    <div class="sidebar-header">
        <img src="/admin/logo.png" class="sidebar-logo" alt="CRR Logo">
        <h4>CRR INFORMTECH</h4>
        <small>CLASS REPRESENTATIVE</small>
    </div>
    <a href="/cr/dashboard.html"><i class="fa-solid fa-house"></i> Dashboard Overview</a>
    <a href="/cr/subjects.html" class="active"><i class="fa-solid fa-book"></i> Manage Subjects</a>
    <a href="/cr/syllabus.html"><i class="fa-solid fa-file-pdf"></i> Section Syllabus</a>
    <a href="/cr/announcements.html"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
    <a href="#" id="student-portal-link" target="_blank"><i class="fa-solid fa-eye"></i> Student Portal View</a>
    <a id="logout-btn" style="cursor:pointer; margin-top:30px; padding:14px 25px; color:#fcd34d; display:block;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</div>

<!-- Main Content Area -->
<div class="main-content" id="main-container">
    <div class="header-card">
        <div>
            <span class="badge bg-primary px-3 py-1 text-white fw-bold mb-2 d-inline-block" style="border-radius:20px; font-size:11px;" id="cr-sec-title">SECTION SUBJECTS</span>
            <h2 class="fw-bold mb-1">Section Subjects Hub</h2>
            <p class="mb-0">Add new theory/lab subjects or upload class materials & assignments</p>
        </div>
        <button class="btn-glass-white" data-bs-toggle="modal" data-bs-target="#addSubjectModal">
            <i class="fa-solid fa-plus-circle me-1"></i> Add New Subject
        </button>
    </div>

    <!-- Subjects Grid (Links Strictly to /cr/subject_details.html!) -->
    <div class="row g-4" id="subjects-grid">
        <div class="text-center py-5 text-white"><i class="fa-solid fa-spinner fa-spin fs-3"></i> Loading section subjects...</div>
    </div>
</div>

<!-- ADD SUBJECT MODAL -->
<div class="modal fade" id="addSubjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 18px;">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-plus-circle me-2"></i> Add Subject for Section</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addSubjectForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject Name *</label>
                        <input type="text" id="sub_name" class="form-control" placeholder="e.g. DBMS, Data Structures, Java" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject Type *</label>
                        <select id="sub_type" class="form-select" required>
                            <option value="Theory">Theory Subject</option>
                            <option value="Lab">Lab / Practical Subject</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Save Subject</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let crYear = '2';
let crSection = 'IT2A';

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar-menu');
    const mainContent = document.getElementById('main-container');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');

    sidebar.classList.toggle('collapsed');
    mainContent.classList.toggle('expanded');
    toggleBtn.classList.toggle('collapsed');
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/cr/dashboard');
        const result = await res.json();
        if (result.success) {
            crYear = result.data.year;
            crSection = result.data.section;
            document.getElementById('cr-sec-title').textContent = `YEAR ${crYear} (${crSection})`;

            const studentUrl = `/student/dashboard.html?year=${encodeURIComponent(crYear)}&section=${encodeURIComponent(crSection)}&from=cr`;
            document.getElementById('student-portal-link').href = studentUrl;

            loadSubjects();
        } else window.location.href = '/cr/login.html';
    } catch(e) { window.location.href = '/cr/login.html'; }
});

async function loadSubjects() {
    const grid = document.getElementById('subjects-grid');
    grid.innerHTML = `<div class="text-center py-5 text-white"><i class="fa-solid fa-spinner fa-spin fs-3"></i> Loading section subjects...</div>`;

    const res = await fetch(`/api/subjects?year=${crYear}&section=${encodeURIComponent(crSection)}`);
    const data = await res.json();

    if (data.success && data.data && data.data.length > 0) {
        grid.innerHTML = data.data.map(s => `
            <div class="col-md-6 col-lg-4">
                <div class="subject-card">
                    <span class="${s.subject_type === 'Lab' ? 'badge-lab' : 'badge-theory'} mb-3 d-inline-block">
                        <i class="fa-solid ${s.subject_type === 'Lab' ? 'fa-flask' : 'fa-book'} me-1"></i> ${s.subject_type.toUpperCase()}
                    </span>
                    <h4 class="fw-bold text-white mb-3 fs-3">${s.subject_name}</h4>
                    <a href="/cr/subject_details.html?year=${crYear}&section=${encodeURIComponent(crSection)}&subject=${encodeURIComponent(s.subject_name)}&type=${s.subject_type}" class="btn-glass-white w-100 text-center">
                        Manage Resources <i class="fa-solid fa-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        `).join('');
    } else {
        grid.innerHTML = `<div class="p-5 text-center text-white bg-white bg-opacity-10 rounded-4 border border-light border-opacity-25"><h5>No Subjects Found for ${crSection}</h5><p>Click "Add New Subject" button to add subjects for your section.</p></div>`;
    }
}

document.getElementById('addSubjectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const subject_name = document.getElementById('sub_name').value;
    const subject_type = document.getElementById('sub_type').value;

    const res = await fetch('/api/subjects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ year: crYear, section: crSection, subject_name, subject_type })
    });
    const result = await res.json();
    if (result.success) {
        bootstrap.Modal.getInstance(document.getElementById('addSubjectModal')).hide();
        document.getElementById('addSubjectForm').reset();
        loadSubjects();
    } else alert(result.message);
});

document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/cr/login.html';
});
</script>
</body>
</html>
