<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements | CR Portal</title>
<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body {
    background: url('/admin/college_bg.jpg') no-repeat center center fixed;
    background-size: cover; min-height: 100vh; position: relative;
}
body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 25, 47, 0.55); backdrop-filter: blur(2px); z-index: 0;
}

.sidebar, .main-content, .sidebar-toggle-btn { position: relative; z-index: 1; }

.sidebar-toggle-btn {
    position: fixed; top: 22px; left: 245px; height: 40px; padding: 0 16px;
    border-radius: 12px; background: rgba(13, 110, 253, 0.9); backdrop-filter: blur(10px);
    color: #ffffff; border: 1.5px solid rgba(255,255,255,0.4); display: flex;
    align-items: center; gap: 8px; font-weight: 700; font-size: 13px;
    cursor: pointer; z-index: 1050; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.35s ease-in-out;
}
.sidebar-toggle-btn:hover { background: #0062cc; transform: translateY(-2px); }
.sidebar-toggle-btn.collapsed { left: 15px; }

.sidebar {
    position: fixed; left: 0; top: 0; width: 270px; height: 100vh;
    background: linear-gradient(180deg, rgba(15, 43, 70, 0.95) 0%, rgba(13, 110, 253, 0.95) 100%);
    backdrop-filter: blur(12px); color: white; padding-top: 25px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.3); z-index: 100; overflow-y: auto;
    transition: all 0.35s ease-in-out;
}
.sidebar.collapsed { transform: translateX(-270px); }

.sidebar-header {
    text-align: center; padding: 0 15px 22px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 20px;
}
.sidebar-logo { width: 55px; height: 55px; border-radius: 50%; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
.sidebar-header h4 { font-weight: 800; font-size: 18px; margin: 0; letter-spacing: 0.5px; color: #ffffff; }
.sidebar-header small { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }

.sidebar a {
    display: flex; align-items: center; gap: 14px; padding: 14px 25px;
    color: rgba(255, 255, 255, 0.9); text-decoration: none; font-size: 14px;
    font-weight: 500; transition: all 0.25s ease; border-left: 4px solid transparent;
}
.sidebar a:hover, .sidebar a.active {
    background: rgba(255, 255, 255, 0.18); color: #ffffff;
    border-left-color: #38bdf8; padding-left: 28px;
}

.main-content { margin-left: 270px; padding: 40px; transition: margin-left 0.35s ease-in-out; }
.main-content.expanded { margin-left: 30px !important; }

.header-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3); padding: 28px 32px; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); margin-bottom: 30px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
}

.announcement-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border-radius: 20px; padding: 28px; border: 1px solid rgba(255, 255, 255, 0.3);
    margin-bottom: 20px; color: white; box-shadow: 0 12px 30px rgba(0,0,0,0.2);
}

.btn-glass-white {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
    color: #ffffff !important; border: 1.5px solid rgba(255, 255, 255, 0.45);
    border-radius: 14px; font-weight: 700; font-size: 14.5px;
    padding: 10px 20px; transition: all 0.25s ease; text-decoration: none; display: inline-block;
}
.btn-glass-white:hover { background: rgba(255, 255, 255, 0.45); transform: translateY(-2px); }
</style>
</head>
<body>

<button class="sidebar-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
    <i class="fa-solid fa-bars"></i>
    <span>Menu</span>
</button>

<div class="sidebar" id="sidebar-menu">
    <div class="sidebar-header">
        <img src="/admin/logo.png" class="sidebar-logo" alt="CRR Logo">
        <h4>CRR INFORMTECH</h4>
        <small>CLASS REPRESENTATIVE</small>
    </div>
    <a href="/cr/dashboard.html"><i class="fa-solid fa-house"></i> Dashboard Overview</a>
    <a href="/cr/subjects.html"><i class="fa-solid fa-book"></i> Manage Subjects</a>
    <a href="/cr/syllabus.html"><i class="fa-solid fa-file-pdf"></i> Section Syllabus</a>
    <a href="/cr/announcements.html" class="active"><i class="fa-solid fa-bullhorn"></i> Announcements</a>
    <a href="#" id="student-portal-link" target="_blank"><i class="fa-solid fa-eye"></i> Student Portal View</a>
    <a id="logout-btn" style="cursor:pointer; margin-top:30px; padding:14px 25px; color:#fcd34d; display:block;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</div>

<div class="main-content" id="main-container">
    <div class="header-card">
        <div>
            <span class="badge bg-primary px-3 py-1 text-white fw-bold mb-2 d-inline-block" style="border-radius:20px; font-size:11px;">SECTION CIRCULARS</span>
            <h2 class="fw-bold text-white mb-1">Department & Section Announcements</h2>
            <p class="text-white-50 mb-0">Post circulars that pop up on Student & Admin portals</p>
        </div>
        <button class="btn-glass-white" data-bs-toggle="modal" data-bs-target="#addAnnouncementModal">
            <i class="fa-solid fa-plus-circle me-1"></i> Post New Announcement
        </button>
    </div>

    <div id="announcements-list">
        <div class="text-center py-5 text-white"><i class="fa-solid fa-spinner fa-spin fs-3"></i> Loading announcements...</div>
    </div>
</div>

<div class="modal fade" id="addAnnouncementModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 18px;">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-bullhorn me-2"></i> Post Section Announcement</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addAnnouncementForm" enctype="multipart/form-data">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Announcement Title *</label>
                        <input type="text" id="a_title" class="form-control" placeholder="e.g. Mid Exam Schedule / Assignment Notice" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Target Audience *</label>
                        <select id="a_target" class="form-select">
                            <option value="All">All Students & Batches</option>
                            <option value="2nd Year">2nd Year Students</option>
                            <option value="3rd Year">3rd Year Students</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Announcement Content / Description *</label>
                        <textarea id="a_content" class="form-control" rows="4" placeholder="Enter circular details..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Poster Image / Attachment (Optional)</label>
                        <input type="file" id="a_poster" class="form-control" accept="image/*,.pdf">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="post-btn"><i class="fa-solid fa-paper-plane me-1"></i> Post Announcement</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let crYear = '2';
let crSection = 'IT2A';

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar-menu');
    const mainContent = document.getElementById('main-container');
    const toggleBtn = document.getElementById('sidebar-toggle-btn');

    sidebar.classList.toggle('collapsed');
    mainContent.classList.toggle('expanded');
    toggleBtn.classList.toggle('collapsed');
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('/api/cr/dashboard');
        const result = await res.json();
        if (result.success) {
            crYear = result.data.year;
            crSection = result.data.section;
            
            const studentUrl = `/student/dashboard.html?year=${encodeURIComponent(crYear)}&section=${encodeURIComponent(crSection)}&from=cr`;
            document.getElementById('student-portal-link').href = studentUrl;

            loadAnnouncements();
        } else window.location.href = '/cr/login.html';
    } catch(e) { window.location.href = '/cr/login.html'; }
});

async function loadAnnouncements() {
    const list = document.getElementById('announcements-list');
    const res = await fetch('/api/announcements');
    const data = await res.json();

    if (data.success && data.data.length > 0) {
        list.innerHTML = data.data.map(a => `
            <div class="announcement-card shadow-sm">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <span class="badge bg-primary px-3 py-1 mb-2 d-inline-block">${a.target_audience || 'All'}</span>
                        <h4 class="fw-bold text-white mb-1">${a.title}</h4>
                        <small class="text-white-50"><i class="fa-regular fa-clock me-1"></i> Posted: ${new Date(a.created_at).toLocaleDateString()}</small>
                    </div>
                    <button class="btn btn-sm btn-outline-danger fw-semibold" onclick="deleteAnnouncement(${a.id})"><i class="fa-solid fa-trash me-1"></i> Delete</button>
                </div>
                <p class="text-white-50 mb-3 fs-6">${a.content}</p>
                ${a.image_path ? `<img src="/${a.image_path}" class="img-fluid rounded-3 border border-light border-opacity-25" style="max-height:300px;">` : ''}
            </div>
        `).join('');
    } else {
        list.innerHTML = `<div class="text-center py-5 text-white bg-white bg-opacity-10 rounded-4 border border-light border-opacity-25"><h5>No Announcements Posted Yet</h5></div>`;
    }
}

document.getElementById('addAnnouncementForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const postBtn = document.getElementById('post-btn');
    postBtn.disabled = true;
    postBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> Posting...`;

    const formData = new FormData();
    formData.append('title', document.getElementById('a_title').value);
    formData.append('target_audience', document.getElementById('a_target').value);
    formData.append('content', document.getElementById('a_content').value);

    const fileInput = document.getElementById('a_poster');
    if (fileInput.files[0]) formData.append('poster', fileInput.files[0]);

    try {
        const res = await fetch('/api/announcements', { method: 'POST', body: formData });
        const result = await res.json();
        if (result.success) {
            bootstrap.Modal.getInstance(document.getElementById('addAnnouncementModal')).hide();
            document.getElementById('addAnnouncementForm').reset();
            loadAnnouncements();
        } else alert(result.message);
    } catch(err) { alert(err.message); }
    finally {
        postBtn.disabled = false;
        postBtn.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> Post Announcement`;
    }
});

async function deleteAnnouncement(id) {
    if (confirm("Are you sure you want to delete this announcement?")) {
        const res = await fetch(`/api/announcements/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) loadAnnouncements();
        else alert(result.message);
    }
}

document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/cr/login.html';
});
</script>
</body>
</html>
