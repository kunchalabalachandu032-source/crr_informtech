<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- FORCED 1200px DESKTOP RESOLUTION FOR MOBILE AND TABLET -->
<meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=3.0">
<title>Subject Resources | Student Portal</title>
<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

/* FORCE 1200px DESKTOP RESOLUTION */
html, body {
    min-width: 1200px !important; width: 1200px !important;
    margin: 0 auto !important; overflow-x: auto !important;
    background: url('/admin/college_bg.jpg') no-repeat center center fixed;
    background-size: cover; min-height: 100vh; position: relative;
}
body::before {
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 25, 47, 0.55); backdrop-filter: blur(2px); z-index: 0;
}

.sidebar, .main-content { position: relative; z-index: 1; }

.sidebar {
    position: fixed; left: 0; top: 0; width: 270px !important; height: 100vh;
    background: linear-gradient(180deg, rgba(15, 43, 70, 0.95) 0%, rgba(13, 110, 253, 0.95) 100%);
    backdrop-filter: blur(12px); color: white; padding-top: 25px;
    box-shadow: 4px 0 20px rgba(0,0,0,0.3); z-index: 100; overflow-y: auto;
    transform: none !important;
}

.sidebar-header {
    text-align: center; padding: 0 15px 22px 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 20px;
}
.sidebar-logo { width: 55px; height: 55px; border-radius: 50%; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.6)); }
.sidebar-header h4 { font-weight: 800; font-size: 18px; margin: 0; letter-spacing: 0.5px; color: #ffffff; }
.sidebar-header small { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }

.sidebar a {
    display: flex; align-items: center; gap: 14px; padding: 14px 25px;
    color: rgba(255, 255, 255, 0.9); text-decoration: none; font-size: 14px;
    font-weight: 500; transition: all 0.25s ease; border-left: 4px solid transparent; cursor: pointer;
}
.sidebar a:hover, .sidebar a.active {
    background: rgba(255, 255, 255, 0.18); color: #ffffff;
    border-left-color: #38bdf8; padding-left: 28px;
}

.main-content { margin-left: 270px !important; width: 930px !important; padding: 40px; }

.header-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3); padding: 28px 32px; border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25); margin-bottom: 30px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
}
.header-card h2 { color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.header-card p { color: rgba(255, 255, 255, 0.85); }

.badge-type { font-size: 11.5px; font-weight: 700; padding: 6px 14px; border-radius: 20px; text-transform: uppercase; }
.badge-theory { background: #e0f2fe; color: #0284c7; }
.badge-lab { background: #fef3c7; color: #d97706; }

.resource-section-card {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(16px);
    border-radius: 20px; padding: 32px; box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    border: 1px solid rgba(255, 255, 255, 0.3); margin-bottom: 25px; animation: fadeIn 0.3s ease;
}

.resource-item-row {
    background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px;
    padding: 20px 24px; margin-top: 14px; transition: transform 0.2s ease;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; color: #ffffff;
}
.resource-item-row h6 { color: #ffffff !important; font-weight: 700; }
.resource-item-row p { color: rgba(255, 255, 255, 0.85) !important; }

.btn-glass-btn {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px);
    color: #ffffff !important; border: 1.5px solid rgba(255, 255, 255, 0.45);
    border-radius: 12px; font-weight: 700; font-size: 13.5px;
    padding: 9px 18px; transition: all 0.25s ease; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
}
.btn-glass-btn:hover { background: rgba(255, 255, 255, 0.45); transform: translateY(-2px); }
</style>
</head>

<body>

<div class="sidebar" id="sidebar-menu">
    <div class="sidebar-header">
        <img src="/admin/logo.png" class="sidebar-logo" alt="CRR Logo">
        <h4>CRR INFORMTECH</h4>
        <small id="sidebar-sec-badge">STUDENT PORTAL</small>
    </div>

    <a href="#" id="back-dashboard-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    <div id="sidebar-menu-links"></div>
</div>

<div class="main-content" id="main-container">
    <div class="header-card">
        <div>
            <span class="badge-type badge-theory mb-2 d-inline-block" id="sub-type-badge">
                <i class="fa-solid fa-book me-1"></i> THEORY
            </span>
            <h2 class="fw-bold mb-1" id="subject-title-header">Subject Resources</h2>
            <p class="mb-0" id="section-meta-text">Access lecture notes, assignments, and question banks</p>
        </div>
        <a href="#" id="top-back-btn" class="btn btn-outline-light fw-semibold px-3 py-2" style="border-radius: 12px;">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <div id="main-resource-cards"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const year = urlParams.get('year') || '2';
const section = urlParams.get('section') || 'IT2A';
const subject = urlParams.get('subject') || '';
const type = (urlParams.get('type') || 'Theory').toLowerCase();
const isLab = type === 'lab';

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const cRes = await fetch(`/api/student/resource-counts?year=${year}&section=${encodeURIComponent(section)}`);
        const cData = await cRes.json();
        if (cData.success && cData.counts && cData.counts[subject.trim()] !== undefined) {
            localStorage.setItem(`seen_cnt_${subject.trim()}`, cData.counts[subject.trim()].toString());
        }
    } catch(e){}

    document.getElementById('sidebar-sec-badge').textContent = `Year ${year} - Section ${section}`;
    document.getElementById('subject-title-header').textContent = `${subject} (${isLab ? 'Lab' : 'Theory'})`;
    document.getElementById('section-meta-text').textContent = `Year ${year} (${section}) — Department of IT (Student View)`;
    
    const badgeEl = document.getElementById('sub-type-badge');
    badgeEl.className = `badge-type ${isLab ? 'badge-lab' : 'badge-theory'} mb-2 d-inline-block`;
    badgeEl.innerHTML = `<i class="fa-solid ${isLab ? 'fa-flask' : 'fa-book'} me-1"></i> ${type.toUpperCase()}`;

    const backDashUrl = `/student/dashboard.html?year=${encodeURIComponent(year)}&section=${encodeURIComponent(section)}`;
    document.getElementById('back-dashboard-link').href = backDashUrl;
    document.getElementById('top-back-btn').href = backDashUrl;

    if (isLab) {
        setupLabTabContainer();
        loadObservations();
        loadRecords();
    } else {
        setupTheoryTabContainer();
        loadClassWorks();
        loadAssignments();
        loadMidMarks();
        loadImpQuestions();
    }
});

function setupTheoryTabContainer() {
    document.getElementById('sidebar-menu-links').innerHTML = `
        <a class="active" onclick="switchTab('class-works', this)"><i class="fa-solid fa-file-lines"></i> Class Works & Notes</a>
        <a onclick="switchTab('assignments', this)"><i class="fa-solid fa-pen-to-square"></i> Student Assignments</a>
        <a onclick="switchTab('mid-marks', this)"><i class="fa-solid fa-chart-column"></i> Mid Marks Sheets</a>
        <a onclick="switchTab('important-questions', this)"><i class="fa-solid fa-question-circle"></i> Important Questions</a>
    `;

    document.getElementById('main-resource-cards').innerHTML = `
        <div class="resource-section-card" id="card-class-works">
            <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-file-lines text-primary me-2"></i> Class Works & Lecture Notes</h4>
            <p class="text-white-50 small mb-3">Materials posted by Faculty and Class Representatives</p>
            <div id="works-container"><div class="text-center py-3 text-white"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading materials...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-assignments">
            <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-pen-to-square text-success me-2"></i> Student Assignments</h4>
            <p class="text-white-50 small mb-3">Assignment topics, questions, and submission due dates</p>
            <div id="assignments-container"><div class="text-center py-3 text-white"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading assignments...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-mid-marks">
            <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-chart-column text-info me-2"></i> Mid Marks Sheets</h4>
            <p class="text-white-50 small mb-3">Mid-1 and Mid-2 internal assessment mark sheets</p>
            <div id="midmarks-container"><div class="text-center py-3 text-white"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading mark sheets...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-important-questions">
            <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-question-circle text-danger me-2"></i> Important Questions & Question Banks</h4>
            <p class="text-white-50 small mb-3">Unit-wise important question banks & exam revision notes</p>
            <div id="impquestions-container"><div class="text-center py-3 text-white"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading questions...</div></div>
        </div>
    `;
}

function setupLabTabContainer() {
    document.getElementById('sidebar-menu-links').innerHTML = `
        <a class="active" onclick="switchTab('lab-observations', this)"><i class="fa-solid fa-flask"></i> Lab Observations</a>
        <a onclick="switchTab('lab-records', this)"><i class="fa-solid fa-file-pdf"></i> Lab Record PDFs</a>
    `;

    document.getElementById('main-resource-cards').innerHTML = `
        <div class="resource-section-card" id="card-lab-observations">
            <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-flask text-warning me-2"></i> Lab Observation Programs</h4>
            <p class="text-white-50 small mb-3">Lab experiment codes, tasks, and observation sheets</p>
            <div id="obs-container"><div class="text-center py-3 text-white"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading observation programs...</div></div>
        </div>

        <div class="resource-section-card d-none" id="card-lab-records">
            <h4 class="fw-bold text-white mb-2"><i class="fa-solid fa-file-pdf text-danger me-2"></i> Lab Record PDFs</h4>
            <p class="text-white-50 small mb-3">Completed lab manual record PDFs for reference</p>
            <div id="records-container"><div class="text-center py-3 text-white"><i class="fa-solid fa-spinner fa-spin me-2"></i> Loading lab records...</div></div>
        </div>
    `;
}

function switchTab(tabId, clickedElement) {
    document.querySelectorAll('.resource-section-card').forEach(card => card.classList.add('d-none'));
    const targetCard = document.getElementById(`card-${tabId}`);
    if (targetCard) targetCard.classList.remove('d-none');

    document.querySelectorAll('#sidebar-menu-links a').forEach(a => a.classList.remove('active'));
    clickedElement.classList.add('active');
}

async function loadClassWorks() {
    const res = await fetch(`/api/class-works?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('works-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(w => `
            <div class="resource-item-row">
                <div><h6 class="fw-bold mb-1">${w.title}</h6><p class="small mb-0">${w.description || 'Lecture notes material'}</p></div>
                ${w.work_file ? `<a href="/${w.work_file}" target="_blank" class="btn-glass-btn"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
            </div>
        `).join('');
    } else container.innerHTML = `<div class="p-3 text-white-50 rounded-3 small"><i class="fa-solid fa-info-circle me-1"></i> No class works uploaded for this subject yet.</div>`;
}

async function loadAssignments() {
    const res = await fetch(`/api/assignments?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('assignments-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(a => `
            <div class="resource-item-row">
                <div>
                    <h6 class="fw-bold mb-1">${a.title}</h6>
                    <small class="text-warning fw-bold d-block mb-1"><i class="fa-regular fa-clock me-1"></i> Due Date: ${a.due_date ? new Date(a.due_date).toLocaleDateString() : 'N/A'}</small>
                    <p class="small mb-0">${a.description || 'Assignment questions'}</p>
                </div>
                ${a.assignment_file ? `<a href="/${a.assignment_file}" target="_blank" class="btn-glass-btn"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
            </div>
        `).join('');
    } else container.innerHTML = `<div class="p-3 text-white-50 rounded-3 small"><i class="fa-solid fa-info-circle me-1"></i> No assignments posted for this subject yet.</div>`;
}

async function loadMidMarks() {
    const res = await fetch(`/api/mid-marks?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('midmarks-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(m => `
            <div class="resource-item-row">
                <div><h6 class="fw-bold mb-0">${m.title}</h6></div>
                ${m.sheet_file ? `<a href="/${m.sheet_file}" target="_blank" class="btn-glass-btn"><i class="fa-solid fa-file-pdf me-1"></i> View Marks Sheet</a>` : ''}
            </div>
        `).join('');
    } else container.innerHTML = `<div class="p-3 text-white-50 rounded-3 small"><i class="fa-solid fa-info-circle me-1"></i> Mid marks sheets not published yet.</div>`;
}

async function loadImpQuestions() {
    const res = await fetch(`/api/important-questions?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('impquestions-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(q => `
            <div class="resource-item-row">
                <div><span class="badge bg-danger text-white mb-1">Unit ${q.unit_number || 'General'}</span><h6 class="fw-bold mb-1">${q.title}</h6><p class="small mb-0">${q.description || ''}</p></div>
                ${q.question_file ? `<a href="/${q.question_file}" target="_blank" class="btn-glass-btn"><i class="fa-solid fa-download me-1"></i> Download File</a>` : ''}
            </div>
        `).join('');
    } else container.innerHTML = `<div class="p-3 text-white-50 rounded-3 small"><i class="fa-solid fa-info-circle me-1"></i> No important question banks uploaded yet.</div>`;
}

async function loadObservations() {
    const res = await fetch(`/api/lab-observations?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('obs-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(o => `
            <div class="resource-item-row">
                <div><span class="badge bg-warning text-dark mb-1">Exp #${o.experiment_no || '1'}</span><h6 class="fw-bold mb-1">${o.title}</h6><p class="small mb-0">${o.description || ''}</p></div>
                ${o.obs_file ? `<a href="/${o.obs_file}" target="_blank" class="btn-glass-btn"><i class="fa-solid fa-download me-1"></i> Download Code/Sheet</a>` : ''}
            </div>
        `).join('');
    } else container.innerHTML = `<div class="p-3 text-white-50 rounded-3 small"><i class="fa-solid fa-info-circle me-1"></i> No lab observations uploaded for this lab yet.</div>`;
}

async function loadRecords() {
    const res = await fetch(`/api/lab-records?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const container = document.getElementById('records-container');
    if (data.success && data.data.length > 0) {
        container.innerHTML = data.data.map(r => `
            <div class="resource-item-row">
                <div><span class="badge bg-danger text-white mb-1">Exp #${r.experiment_no || '1'}</span><h6 class="fw-bold mb-0">${r.title}</h6></div>
                ${r.record_file ? `<a href="/${r.record_file}" target="_blank" class="btn-glass-btn"><i class="fa-solid fa-file-pdf me-1"></i> View Record PDF</a>` : ''}
            </div>
        `).join('');
    } else container.innerHTML = `<div class="p-3 text-white-50 rounded-3 small"><i class="fa-solid fa-info-circle me-1"></i> No lab record PDFs uploaded yet.</div>`;
}
</script>
</body>
</html>
