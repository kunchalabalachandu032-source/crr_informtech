<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Academic Year | CRR-INFORMTECH</title>

<!-- Bootstrap 5.3 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #eef2f9;
    background-image: 
        radial-gradient(at 10% 10%, rgba(13, 110, 253, 0.05) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(3, 105, 161, 0.05) 0px, transparent 50%);
    min-height: 100vh;
}

/* ================= Header ================= */
.header-box {
    background: linear-gradient(120deg, #0f2b46 0%, #0d6efd 60%, #0369a1 100%);
    color: white;
    padding: 40px 20px;
    text-align: center;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
    box-shadow: 0 10px 30px rgba(13, 110, 253, 0.2);
    position: relative;
}

.header-box h1 {
    font-weight: 800;
    font-size: 30px;
    margin-bottom: 6px;
}

.header-box p {
    font-size: 14px;
    opacity: 0.9;
    margin: 0;
    letter-spacing: 0.5px;
}

.back-top {
    position: absolute;
    left: 25px;
    top: 30px;
}

.btn-back {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 8px 20px;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-back:hover {
    background: #ffffff;
    color: #0d6efd;
}

/* ================= Cards Container ================= */
.container-box {
    max-width: 1050px;
    margin: 50px auto 40px auto;
    padding: 0 20px;
    display: flex;
    justify-content: center;
    gap: 35px;
    flex-wrap: wrap;
}

.card-year-clean {
    width: 320px;
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 22px;
    padding: 35px 28px;
    text-align: center;
    background: #ffffff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.card-year-clean::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #0d6efd, #0369a1);
}

.card-year-clean:hover {
    transform: translateY(-8px);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.1);
}

.year-icon-box {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 22px auto;
    background: #e0f2fe;
    color: #0284c7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 6px 18px rgba(2, 132, 199, 0.18);
    transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
}

.card-year-clean:hover .year-icon-box {
    transform: scale(1.08);
    background: linear-gradient(135deg, #0d6efd, #0a58ca);
    color: #ffffff;
    box-shadow: 0 10px 22px rgba(13, 110, 253, 0.35);
}

.card-year-clean h2 {
    font-weight: 800;
    font-size: 24px;
    color: #1e293b;
    margin-bottom: 10px;
}

.card-year-clean p {
    font-size: 13.5px;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 28px;
}

.btn-open-clean {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    background: linear-gradient(135deg, #0d6efd, #0369a1);
    color: white;
    padding: 13px 32px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14.5px;
    width: 100%;
    transition: all 0.25s ease;
    box-shadow: 0 6px 18px rgba(13, 110, 253, 0.22);
}

.btn-open-clean:hover {
    background: linear-gradient(135deg, #0a58ca, #0284c7);
    color: white;
    box-shadow: 0 10px 24px rgba(13, 110, 253, 0.35);
    transform: translateY(-2px);
}
</style>

</head>

<body>

<div class="header-box">
    <div class="back-top">
        <a href="dashboard.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </div>

    <h1>📅 Select Academic Year</h1>
    <p>Department of Information Technology | CRR-INFORMTECH</p>
</div>

<div class="container-box">

    <!-- 2ND YEAR CARD -->
    <div class="card-year-clean">
        <div>
            <div class="year-icon-box">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2>2nd Year</h2>
            <p>Access Information Technology 2nd Year Subjects, Sections & Lab Modules.</p>
        </div>

        <a class="btn-open-clean" href="sections.html?year=2">
            <i class="fa-solid fa-folder-open"></i> Open 2nd Year
        </a>
    </div>

    <!-- 3RD YEAR CARD -->
    <div class="card-year-clean">
        <div>
            <div class="year-icon-box">
                <i class="fa-solid fa-book-open-reader"></i>
            </div>
            <h2>3rd Year</h2>
            <p>Access Information Technology 3rd Year Subjects, Sections & Lab Modules.</p>
        </div>

        <a class="btn-open-clean" href="sections.html?year=3">
            <i class="fa-solid fa-folder-open"></i> Open 3rd Year
        </a>
    </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
