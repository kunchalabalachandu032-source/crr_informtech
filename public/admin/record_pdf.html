<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Record PDFs | CRR-INFORMTECH</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: #eef2f9; min-height: 100vh; }
.header { background: linear-gradient(120deg, #0f2b46 0%, #0d6efd 100%); color: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; }
.work-card { background: white; border-radius: 16px; padding: 22px; border: 1px solid rgba(0,0,0,0.06); margin-bottom: 20px; }
</style>
</head>
<body>

<div class="container py-4">
    <div class="header d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <a href="#" id="back-btn" class="btn btn-sm btn-light mb-2 fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Back to Subject Details</a>
            <h2 class="fw-bold mb-0" id="page-title">Lab Record PDFs</h2>
            <small id="page-subtitle" class="opacity-75">Year & Section</small>
        </div>
        <button class="btn btn-light text-primary fw-bold px-4 py-2" data-bs-toggle="modal" data-bs-target="#addModal" style="border-radius: 10px;">
            <i class="fa-solid fa-cloud-arrow-up me-1"></i> Upload Lab Record PDF
        </button>
    </div>

    <div id="list">
        <div class="text-center py-5 text-muted"><i class="fa-solid fa-spinner fa-spin fs-3 text-primary"></i> Loading record PDFs...</div>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-file-pdf me-2"></i> Upload Lab Record PDF</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addForm" enctype="multipart/form-data">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Experiment No *</label>
                        <input type="text" id="experiment_no" class="form-control" placeholder="e.g. Exp 1 / Record 1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Record Title *</label>
                        <input type="text" id="title" class="form-control" placeholder="e.g. DBMS Lab Record Experiment 1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Upload Record PDF File *</label>
                        <input type="file" id="record_file" class="form-control" accept=".pdf, image/*" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger"><i class="fa-solid fa-upload me-1"></i> Upload Record</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const year = params.get('year');
const section = params.get('section');
const subject = params.get('subject');
const isCr = params.get('portal') === 'cr';

const backUrl = isCr 
    ? `/cr/subject_details.html?year=${encodeURIComponent(year)}&section=${encodeURIComponent(section)}&subject=${encodeURIComponent(subject)}&type=Lab`
    : `/admin/subject_details.html?year=${encodeURIComponent(year)}&section=${encodeURIComponent(section)}&subject=${encodeURIComponent(subject)}&type=Lab`;
document.getElementById('back-btn').href = backUrl;

document.getElementById('page-title').textContent = `${subject} Lab Records`;
document.getElementById('page-subtitle').textContent = `Year ${year} | Section ${section}`;

document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
    const res = await fetch(`/api/lab-records?year=${year}&section=${section}&subject=${encodeURIComponent(subject)}`);
    const data = await res.json();
    const list = document.getElementById('list');

    if (data.success && data.data.length > 0) {
        list.innerHTML = data.data.map(w => `
            <div class="work-card shadow-sm d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <span class="badge bg-danger text-white mb-1">Exp #${w.experiment_no || '1'}</span>
                    <h5 class="fw-bold text-dark mb-1">${w.title}</h5>
                    ${w.record_file ? `<a href="/${w.record_file}" target="_blank" class="btn btn-sm btn-outline-danger fw-semibold mt-2"><i class="fa-solid fa-file-pdf me-1"></i> View Record PDF</a>` : ''}
                </div>
                <button class="btn btn-sm btn-outline-danger fw-semibold" onclick="deleteData(${w.id})"><i class="fa-solid fa-trash me-1"></i> Delete</button>
            </div>
        `).join('');
    } else {
        list.innerHTML = `<div class="text-center py-5 text-muted bg-white rounded-4 shadow-sm p-4"><i class="fa-solid fa-file-pdf fs-1 text-secondary mb-2 d-block"></i><h5>No Lab Record PDFs Uploaded Yet</h5></div>`;
    }
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData();
    formData.append('year', year);
    formData.append('section', section);
    formData.append('subject_name', subject);
    formData.append('experiment_no', document.getElementById('experiment_no').value);
    formData.append('title', document.getElementById('title').value);
    
    const fileInput = document.getElementById('record_file');
    if (fileInput.files[0]) formData.append('record_file', fileInput.files[0]);

    const res = await fetch('/api/lab-records', { method: 'POST', body: formData });
    const result = await res.json();
    if (result.success) {
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        document.getElementById('addForm').reset();
        loadData();
    } else alert(result.message);
});

async function deleteData(id) {
    if (confirm("Are you sure you want to delete this record PDF?")) {
        const res = await fetch(`/api/lab-records/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) loadData();
        else alert(result.message);
    }
}
</script>
</body>
</html>
